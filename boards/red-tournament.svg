<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Red tournament checkerboard">
  <defs>
    <pattern id="checker" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="#ddb9b6"/>
      <rect x="100" width="100" height="100" fill="#af1730"/>
      <rect y="100" width="100" height="100" fill="#af1730"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#checker)"/>
</svg>
